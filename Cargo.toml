[package]
name = "maolan-widgets"
version = "0.1.5"
edition = "2024"
description = "Widgets used for Maolan DAW"
license = "BSD-2-Clause"
readme = "README.md"
repository = "https://github.com/maolan/widgets"
homepage = "https://maolan.rs"
documentation = "https://doc.maolan.rs"
keywords = ["audio", "midi", "daw", "widgets"]
categories = ["multimedia::audio"]

[dependencies]
bytemuck = "1.25.0"
iced = { version = "0.14.0", features = ["advanced", "canvas", "image", "lazy", "tokio"] }
iced_aw = { version = "0.14.1", features = ["wrap"] }
iced_drop = { version = "0.2.54", features = ["helpers"] }
iced_fonts = { version = "0.3.0", features = ["lucide"] }
iced_wgpu = "0.14.0"
serde = { version = "1.0.229", features = ["derive"] }
symphonia = { version = "0.6.1", features = ["wav"] }
